name: Build Media Shield

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Media Shield
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Media Shield
        run: npm run build

      - name: Prepare Chrome extension
        run: |
          rm -rf chrome-build
          mkdir -p chrome-build

          cp -R dist/. chrome-build/

          cp manifest.json chrome-build/manifest.json
          cp popup.js chrome-build/popup.js
          cp analysis.js chrome-build/analysis.js

          if [ -f metadata.js ]; then
            cp metadata.js chrome-build/metadata.js
          fi

          echo "=== CHROME EXTENSION CONTENTS ==="
          find chrome-build -type f -print | sort

      - name: Verify required Chrome files
        run: |
          test -f chrome-build/manifest.json
          test -f chrome-build/popup.html
          test -f chrome-build/popup.js
          test -f chrome-build/analysis.html
          test -f chrome-build/analysis.js
          test -f chrome-build/metadata.js
          test -f chrome-build/assets/provenance.js

          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(
            fs.readFileSync('chrome-build/manifest.json', 'utf8')
          );

          if (manifest.manifest_version !== 3) {
            throw new Error('Invalid manifest version.');
          }

          if (manifest.version !== '3.0.0') {
            throw new Error(
              'Expected Media Shield version 3.0.0, found ' +
              manifest.version
            );
          }

          console.log(
            'Media Shield manifest version:',
            manifest.version
          );
          "

          echo "Media Shield V3 Chrome package verification passed."

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: media-shield-chrome-v3
          path: chrome-build/
          if-no-files-found: error
